name: Build Ultron GUI EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyttsx3 SpeechRecognition requests psutil

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile ultron_omega_gui.py

    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Ultron-Omega-GUI-EXE
        path: dist/ultron_omega_gui.exe
